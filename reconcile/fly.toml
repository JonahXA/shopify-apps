# Fly.io config for Reconcile. App name is set at `fly launch`/`fly apps create`.
app = "reconcile-app"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # Non-secret QBO config; secrets (client id/secret) go via `fly secrets set`.
  QBO_ENV = "sandbox"
  BILLING_TEST = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
