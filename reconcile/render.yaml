# Render blueprint for Reconcile — no card required on the free tier.
# Free web service sleeps after ~15 min idle (cold start on next hit); fine for
# dev/testing/first installs. Free Postgres expires after 30 days — upgrade both
# when real merchants arrive. Deploy: push to GitHub, then New → Blueprint.
services:
  - type: web
    name: reconcile
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: QBO_ENV
        value: sandbox
      - key: BILLING_TEST
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: reconcile-db
          property: connectionString
      # Secrets set in the Render dashboard (marked sync:false so the
      # blueprint doesn't store them): SHOPIFY_API_KEY, SHOPIFY_API_SECRET,
      # QBO_CLIENT_ID, QBO_CLIENT_SECRET, JOBS_TOKEN, SHOPIFY_APP_URL,
      # QBO_REDIRECT_URI.
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: QBO_CLIENT_ID
        sync: false
      - key: QBO_CLIENT_SECRET
        sync: false
      - key: JOBS_TOKEN
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: QBO_REDIRECT_URI
        sync: false

databases:
  - name: reconcile-db
    plan: free
    databaseName: reconcile
